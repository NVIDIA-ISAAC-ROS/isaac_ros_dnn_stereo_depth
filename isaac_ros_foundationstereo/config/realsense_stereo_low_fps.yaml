device_type: ''
serial_no: ''
usb_port_id: ''

enable_accel: false
enable_color: false
enable_depth: false
enable_gyro: false
enable_infra1: true
enable_infra2: true

depth_qos: "SYSTEM_DEFAULT"
depth_module:
  # FPS lowered from 90 -> 15 so the camera does not outrun FoundationStereo
  # inference (the previous 90 FPS caused persistent downstream backpressure
  # and dropped/unsynchronized tensor pairs). Supported 640x360 rates:
  # 90, 60, 30, 15, 6. Lower further (e.g. 6) if drops persist.
  depth_profile: '640x360x15'
  infra_profile: '640x360x15'
  profile: '640x360x15' # For backwards compatibility
  emitter_enabled: 0
  emitter_on_off: false
